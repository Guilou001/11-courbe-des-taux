[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", tag = "v0.2.1" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ycc"
version = "0.1.0"
description = "La courbe des taux canadienne : Diebold-Li contre la marche aléatoire, probit de récession avec pente nette de prime de terme, module ALM aux chocs IRRBB."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "gvf[figures]>=0.2.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "typer>=0.12",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ycc = "ycc.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/11-courbe-des-taux"

[tool.hatch.build.targets.wheel]
packages = ["src/ycc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
